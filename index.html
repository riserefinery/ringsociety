<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Ring Society — Your Trusted Guide to the Perfect Engagement Ring</title>
    <meta
      name="description"
      content="Ring Society is the trusted guide to buying an engagement ring — expert advice on diamonds, ring settings, budgets, and how to find and evaluate the right jeweler."
    />
    <meta name="theme-color" content="#244737" />
    <link rel="canonical" href="https://ringsociety.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ring Society" />
    <meta property="og:title" content="Ring Society — Your Trusted Guide to the Perfect Engagement Ring" />
    <meta
      property="og:description"
      content="Expert, unbiased guides on diamonds, ring settings, budgets, and choosing the right jeweler — everything you need before you buy an engagement ring."
    />
    <meta property="og:url" content="https://ringsociety.com/" />
    <meta property="og:image" content="https://files.manuscdn.com/user_upload_by_module/session_file/310519663235760234/RYBFIhkABMOYqBjI.jpg" />
    <meta property="og:image:alt" content="Ring Society — the trusted guide to the perfect engagement ring" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ring Society — Your Trusted Guide to the Perfect Engagement Ring" />
    <meta
      name="twitter:description"
      content="Expert, unbiased guides on diamonds, ring settings, budgets, and choosing the right jeweler."
    />
    <meta name="twitter:image" content="https://files.manuscdn.com/user_upload_by_module/session_file/310519663235760234/RYBFIhkABMOYqBjI.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ringsociety.com/#organization",
            "name": "Ring Society",
            "url": "https://ringsociety.com/",
            "description": "Your trusted guide to the perfect engagement ring.",
            "sameAs": [
              "https://www.instagram.com/ringsociety",
              "https://www.pinterest.com/ringsociety"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://ringsociety.com/#website",
            "url": "https://ringsociety.com/",
            "name": "Ring Society",
            "publisher": { "@id": "https://ringsociety.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://ringsociety.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
